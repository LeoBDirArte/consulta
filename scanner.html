<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Escáner QR · BITAZETA</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef7f5;color:#17343d;display:flex;justify-content:center;min-height:100vh}
.wrap{width:min(560px,calc(100% - 28px));margin:24px auto;background:#fff;border:1px solid #dce8e8;border-radius:22px;padding:24px;box-shadow:0 18px 55px rgba(20,65,76,.13);align-self:flex-start}
h1{font-size:22px;margin:0 0 7px;color:#123b49}
p{font-size:13px;line-height:1.5;color:#60777d;margin:0 0 18px}.badge{font-size:9px;letter-spacing:1.4px;font-weight:900;color:#079b73;margin-bottom:9px}
#reader{width:100%;overflow:hidden;border-radius:14px;background:#101820;min-height:280px;position:relative}
#video{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;background:#101820}
.estado{margin-top:14px;padding:11px 12px;background:#f4f8f8;border:1px solid #dce8e8;border-radius:10px;font-size:12px}.pie{margin-top:18px;text-align:center;font-size:9px;letter-spacing:1px;color:#789097}
</style>
</head>
<body>
<div class="wrap">
  <div class="badge">LEO B. · TRANSFORMACIÓN DOCUMENTAL</div>
  <h1>ESCANEAR CÓDIGO QR</h1>
  <p>Apunte la cámara del PC al QR de la AZETA. La lectura se realiza automáticamente y vuelve a BITAZETA al detectar un código válido.</p>
  <div id="reader"><video id="video" autoplay muted playsinline></video></div>
  <div id="estado" class="estado">Preparando cámara...</div>
  <div class="pie">BITAZETA · LECTURA QR RÁPIDA</div>
</div>

<script>
const estado = document.getElementById('estado');
const video = document.getElementById('video');
const APP_URL = 'https://script.google.com/macros/s/AKfycbxAUvmJ_qdD9i_yr8ZV4UgASHsqC-0HPhISLBWAzIlDg0gfxfUvaIUuYjaN0eMezfoRxw/exec';

let enviado = false;
let stream = null;
let detector = null;
let rafId = null;
let ultimoIntento = 0;
let scannerFallback = null;
let iniciando = false;

function limpiarCodigo(raw) {
  const texto = String(raw || '').trim().toUpperCase();
  if (!texto) return '';

  try {
    const u = new URL(texto);
    const q = u.searchParams.get('az') || u.searchParams.get('codigo') || u.searchParams.get('code');
    if (q) return String(q).trim().toUpperCase();
  } catch (e) {}

  const directo = texto.match(/AZ-\d+/);
  return directo ? directo[0] : texto;
}

function procesarCodigo(raw) {
  if (enviado) return;
  const codigo = limpiarCodigo(raw);
  if (!/^AZ-\d+$/.test(codigo)) return;

  enviado = true;
  estado.innerHTML = '<strong style="color:#176b35;">QR detectado: ' + codigo + '</strong><br>Regresando a BITAZETA...';
  detenerTodo();

  if (window.opener && !window.opener.closed) {
    try {
      window.opener.postMessage({type:'AZ_SCAN', code:codigo}, '*');
      setTimeout(function(){ try{window.close();}catch(e){} }, 180);
      return;
    } catch(e) {}
  }

  const params = new URLSearchParams(window.location.search || '');
  const session = params.get('session') || params.get('token') || '';
  setTimeout(function(){
    window.location.href = APP_URL + '?az=' + encodeURIComponent(codigo) + '&session=' + encodeURIComponent(session);
  }, 120);
}

function detenerFallback() {
  if (!scannerFallback) return;
  try { scannerFallback.stop().catch(function(){}); } catch(e) {}
  scannerFallback = null;
}

function detenerTodo() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  detenerFallback();
  if (stream) {
    stream.getTracks().forEach(function(track){ try{track.stop();}catch(e){} });
    stream = null;
  }
  try { video.pause(); } catch(e) {}
}

async function iniciarNativo() {
  if (!('BarcodeDetector' in window)) return false;

  detector = new BarcodeDetector({formats:['qr_code']});
  estado.innerHTML = 'Cámara activa. Lectura QR nativa rápida...';

  let ultimaLectura = 0;
  async function detectar() {
    if (enviado || !video.videoWidth) return;
    const ahora = performance.now();
    if (ahora - ultimaLectura < 80) {
      rafId = requestAnimationFrame(detectar);
      return;
    }
    ultimaLectura = ahora;

    try {
      const resultados = await detector.detect(video);
      if (resultados && resultados.length) {
        for (const r of resultados) {
          const raw = r.rawValue || '';
          const codigo = limpiarCodigo(raw);
          if (/^AZ-\d+$/.test(codigo)) {
            procesarCodigo(codigo);
            return;
          }
        }
      }
    } catch(e) {}

    if (!enviado) rafId = requestAnimationFrame(detectar);
  }

  rafId = requestAnimationFrame(detectar);
  return true;
}

async function iniciarFallback() {
  if (typeof Html5Qrcode === 'undefined') {
    throw new Error('No fue posible cargar el lector QR de respaldo.');
  }

  const camaras = await Html5Qrcode.getCameras();
  if (!camaras || !camaras.length) throw new Error('No se encontró ninguna cámara disponible en el PC.');

  scannerFallback = new Html5Qrcode('reader');
  estado.innerHTML = 'Cámara activa. Lector QR de respaldo...';

  await scannerFallback.start(
    camaras[0].id,
    {
      fps:30,
      formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE],
      qrbox:function(w,h){
        const lado=Math.floor(Math.min(w,h)*0.82);
        return {width:Math.max(220,Math.min(lado,460)),height:Math.max(220,Math.min(lado,460))};
      },
      aspectRatio:1.777778,
      disableFlip:true
    },
    function(decodedText){ procesarCodigo(decodedText); },
    function(){}
  );
}

async function iniciarScanner() {
  if (iniciando || enviado) return;
  iniciando = true;

  try {
    estado.innerHTML = 'Solicitando acceso a la cámara del PC...';

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('El navegador no permite acceder a la cámara desde esta página.');
    }

    const restricciones = {
      video:{
        width:{ideal:1280},
        height:{ideal:720},
        facingMode:{ideal:'environment'}
      },
      audio:false
    };

    stream = await navigator.mediaDevices.getUserMedia(restricciones);
    video.srcObject = stream;
    await video.play();

    const nativo = await iniciarNativo();
    if (!nativo) {
      detenerTodo();
      await iniciarFallback();
    }

  } catch(error) {
    detenerTodo();
    estado.innerHTML = '<strong style="color:#b71c1c;">No se pudo iniciar la cámara.</strong><br>' +
      (error && error.message ? error.message : 'Error desconocido.');
  } finally {
    iniciando = false;
  }
}

window.addEventListener('beforeunload', detenerTodo);
iniciarScanner();
</script>
</body>
</html>
